<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bhasha – Language Learning</title>
<style>
:root{--bg:#faf7f2;--card:#ffffff;--tx:#1f2430;--mut:#6b7280;--ac:#e8590c;--ac2:#fff0e4;--ok:#2f9e44;--bad:#e03131;--bd:#e7e2d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--card:#1f232b;--tx:#eef0f4;--mut:#9aa3b2;--ac:#ff8a3d;--ac2:#33261c;--ok:#51cf66;--bad:#ff6b6b;--bd:#2e333d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171c;--card:#1f232b;--tx:#eef0f4;--mut:#9aa3b2;--ac:#ff8a3d;--ac2:#33261c;--ok:#51cf66;--bad:#ff6b6b;--bd:#2e333d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.app{max-width:560px;margin:0 auto;padding:16px 16px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{font-size:22px;margin:0}
h1 span{color:var(--ac)}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:12px 4px;font:inherit;font-size:13px;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}
.chips{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;text-align:center;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;user-select:none}
.card .en{font-size:26px;font-weight:700}
.card .nat{font-size:38px;font-weight:700;color:var(--ac)}
.card .rom{font-size:18px;color:var(--mut)}
.hint{font-size:13px;color:var(--mut)}
.tip{background:var(--ac2);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px;border-radius:12px;font:inherit;cursor:pointer}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn.k{border-color:var(--ok);color:var(--ok)}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.q{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;text-align:center}
.q .nat{font-size:34px;font-weight:700;color:var(--ac)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--ac)}
.big{font-size:44px;font-weight:800;color:var(--ac);text-align:center}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item b{font-size:18px}
.small{font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Bhasha <span>भाषा</span></h1>
    <select id="lang" aria-label="Language"></select>
  </header>
  <main id="main"></main>
</div>
<nav><div id="nav"></div></nav>

<script>
// Each item: [English, Native script, Romanized / pronunciation]. Index 0-4 vocabulary, 5-9 phrases, 10-11 grammar sentences.
var L = {
 hi:{n:"Hindi",v:"hi-IN",t:"Hindi sentences follow Subject–Object–Verb order, and verbs change with gender.",w:[["Water","पानी","paani"],["Food","खाना","khaana"],["Friend","दोस्त","dost"],["House","घर","ghar"],["Book","किताब","kitaab"],["Hello","नमस्ते","namaste"],["Thank you","धन्यवाद","dhanyavaad"],["Good morning","सुप्रभात","suprabhaat"],["How are you?","आप कैसे हैं?","aap kaise hain?"],["What is your name?","आपका नाम क्या है?","aapka naam kya hai?"],["I drink water.","मैं पानी पीता हूँ।","main paani peeta hoon"],["This is my book.","यह मेरी किताब है।","yah meri kitaab hai"]]},
 mr:{n:"Marathi",v:"mr-IN",t:"Marathi uses Subject–Object–Verb order and has three genders: masculine, feminine and neuter.",w:[["Water","पाणी","paani"],["Food","जेवण","jevan"],["Friend","मित्र","mitra"],["House","घर","ghar"],["Book","पुस्तक","pustak"],["Hello","नमस्कार","namaskar"],["Thank you","धन्यवाद","dhanyavad"],["Good morning","शुभ प्रभात","shubh prabhat"],["How are you?","तुम्ही कसे आहात?","tumhi kase aahat?"],["What is your name?","तुमचे नाव काय आहे?","tumche naav kaay aahe?"],["I drink water.","मी पाणी पितो.","mi paani pito"],["This is my book.","हे माझे पुस्तक आहे.","he majhe pustak aahe"]]},
 ta:{n:"Tamil",v:"ta-IN",t:"Tamil is Subject–Object–Verb and adds suffixes to words instead of using many prepositions.",w:[["Water","தண்ணீர்","thanneer"],["Food","உணவு","unavu"],["Friend","நண்பர்","nanbar"],["House","வீடு","veedu"],["Book","புத்தகம்","puthagam"],["Hello","வணக்கம்","vanakkam"],["Thank you","நன்றி","nandri"],["Good morning","காலை வணக்கம்","kaalai vanakkam"],["How are you?","நீங்கள் எப்படி இருக்கிறீர்கள்?","neengal eppadi irukkireergal?"],["What is your name?","உங்கள் பெயர் என்ன?","ungal peyar enna?"],["I drink water.","நான் தண்ணீர் குடிக்கிறேன்.","naan thanneer kudikkiren"],["This is my book.","இது என் புத்தகம்.","idhu en puthagam"]]},
 te:{n:"Telugu",v:"te-IN",t:"Telugu is Subject–Object–Verb and words usually end in vowels.",w:[["Water","నీరు","neeru"],["Food","ఆహారం","aaharam"],["Friend","స్నేహితుడు","snehithudu"],["House","ఇల్లు","illu"],["Book","పుస్తకం","pustakam"],["Hello","నమస్కారం","namaskaram"],["Thank you","ధన్యవాదాలు","dhanyavaadaalu"],["Good morning","శుభోదయం","shubhodayam"],["How are you?","మీరు ఎలా ఉన్నారు?","meeru ela unnaru?"],["What is your name?","మీ పేరు ఏమిటి?","mee peru emiti?"],["I drink water.","నేను నీరు తాగుతాను.","nenu neeru taagutaanu"],["This is my book.","ఇది నా పుస్తకం.","idi naa pustakam"]]},
 bn:{n:"Bengali",v:"bn-IN",t:"Bengali is Subject–Object–Verb and has no grammatical gender for nouns.",w:[["Water","জল","jol"],["Food","খাবার","khabar"],["Friend","বন্ধু","bondhu"],["House","বাড়ি","bari"],["Book","বই","boi"],["Hello","নমস্কার","nomoshkar"],["Thank you","ধন্যবাদ","dhonnobad"],["Good morning","শুভ সকাল","shubho shokal"],["How are you?","আপনি কেমন আছেন?","apni kemon achhen?"],["What is your name?","আপনার নাম কী?","apnar naam ki?"],["I drink water.","আমি জল খাই।","ami jol khai"],["This is my book.","এটা আমার বই।","eta amar boi"]]},
 gu:{n:"Gujarati",v:"gu-IN",t:"Gujarati is Subject–Object–Verb and nouns have three genders.",w:[["Water","પાણી","paani"],["Food","ખોરાક","khorak"],["Friend","મિત્ર","mitra"],["House","ઘર","ghar"],["Book","પુસ્તક","pustak"],["Hello","નમસ્તે","namaste"],["Thank you","આભાર","aabhaar"],["Good morning","સુપ્રભાત","suprabhat"],["How are you?","તમે કેમ છો?","tame kem chho?"],["What is your name?","તમારું નામ શું છે?","tamaru naam shu chhe?"],["I drink water.","હું પાણી પીઉં છું.","hun paani piun chhun"],["This is my book.","આ મારું પુસ્તક છે.","aa maaru pustak chhe"]]},
 kn:{n:"Kannada",v:"kn-IN",t:"Kannada is Subject–Object–Verb and uses suffixes to show case and tense.",w:[["Water","ನೀರು","neeru"],["Food","ಆಹಾರ","aahaara"],["Friend","ಸ್ನೇಹಿತ","snehita"],["House","ಮನೆ","mane"],["Book","ಪುಸ್ತಕ","pustaka"],["Hello","ನಮಸ್ಕಾರ","namaskara"],["Thank you","ಧನ್ಯವಾದ","dhanyavaada"],["Good morning","ಶುಭೋದಯ","shubhodaya"],["How are you?","ನೀವು ಹೇಗಿದ್ದೀರಿ?","neevu hegiddeeri?"],["What is your name?","ನಿಮ್ಮ ಹೆಸರೇನು?","nimma hesarenu?"],["I drink water.","ನಾನು ನೀರು ಕುಡಿಯುತ್ತೇನೆ.","naanu neeru kudiyuttene"],["This is my book.","ಇದು ನನ್ನ ಪುಸ್ತಕ.","idu nanna pustaka"]]},
 ml:{n:"Malayalam",v:"ml-IN",t:"Malayalam is Subject–Object–Verb and the verb does not change for person.",w:[["Water","വെള്ളം","vellam"],["Food","ഭക്ഷണം","bhakshanam"],["Friend","സുഹൃത്ത്","suhruthu"],["House","വീട്","veedu"],["Book","പുസ്തകം","pusthakam"],["Hello","നമസ്കാരം","namaskaram"],["Thank you","നന്ദി","nandi"],["Good morning","സുപ്രഭാതം","suprabhaatham"],["How are you?","സുഖമാണോ?","sukhamaano?"],["What is your name?","നിങ്ങളുടെ പേര് എന്താണ്?","ningalude peru enthaanu?"],["I drink water.","ഞാൻ വെള്ളം കുടിക്കുന്നു.","njaan vellam kudikkunnu"],["This is my book.","ഇത് എന്റെ പുസ്തകം ആണ്.","ithu ente pusthakam aanu"]]},
 es:{n:"Spanish",v:"es-ES",t:"Spanish nouns are masculine or feminine (el/la), and verbs change with the subject.",w:[["Water","agua","ah-gwah"],["Food","comida","ko-mee-dah"],["Friend","amigo","ah-mee-go"],["House","casa","kah-sah"],["Book","libro","lee-bro"],["Hello","Hola","oh-lah"],["Thank you","Gracias","grah-syahs"],["Good morning","Buenos días","bweh-nos dee-ahs"],["How are you?","¿Cómo estás?","ko-mo es-tahs"],["What is your name?","¿Cómo te llamas?","ko-mo teh yah-mahs"],["I drink water.","Bebo agua.","beh-bo ah-gwah"],["This is my book.","Este es mi libro.","es-teh es mee lee-bro"]]},
 fr:{n:"French",v:"fr-FR",t:"French nouns are masculine or feminine (le/la), and adjectives usually follow the noun.",w:[["Water","eau","oh"],["Food","nourriture","noo-ree-tur"],["Friend","ami","ah-mee"],["House","maison","meh-zon"],["Book","livre","leevr"],["Hello","Salut","sah-lu"],["Thank you","Merci","mehr-see"],["Good morning","Bonjour","bon-zhoor"],["How are you?","Comment allez-vous ?","ko-mohn tah-lay voo"],["What is your name?","Comment vous appelez-vous ?","ko-mohn voo zah-play voo"],["I drink water.","Je bois de l’eau.","zhuh bwah duh loh"],["This is my book.","C’est mon livre.","seh mon leevr"]]}
};
var CATS = {vocab:["Vocabulary",0,5], phrases:["Phrases",5,10], grammar:["Grammar",10,12]};
var TABS = [["learn","Learn"],["daily","Daily"],["quiz","Quiz"],["progress","Progress"]];

var S = {lang:"hi", cat:"vocab", tab:"learn", i:0, flip:false, q:null};
var P = {known:{}, best:{}, days:[]};
try { var saved = JSON.parse(localStorage.getItem("bhasha_v1")); if (saved) { P = saved; S.lang = saved.lang || "hi"; } } catch (e) {}
function save() { try { P.lang = S.lang; localStorage.setItem("bhasha_v1", JSON.stringify(P)); } catch (e) {} }

function $(id) { return document.getElementById(id); }
function today() { return new Date().toISOString().slice(0, 10); }
function isKnown(l, i) { return (P.known[l] || []).indexOf(i) > -1; }
function toggleKnown(l, i) {
  var a = P.known[l] || [];
  var k = a.indexOf(i);
  if (k > -1) a.splice(k, 1); else a.push(i);
  P.known[l] = a; save();
}
function speak(text) {
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = L[S.lang].v; u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function streak() {
  var d = new Date(), n = 0;
  while (P.days.indexOf(d.toISOString().slice(0, 10)) > -1) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function cardHTML(it, tip) {
  return (tip ? '<div class="tip">💡 ' + tip + '</div>' : '') +
    '<div class="card" data-a="flip">' +
    (S.flip
      ? '<div class="nat">' + it[1] + '</div><div class="rom">' + it[2] + '</div><div class="en" style="font-size:16px;color:var(--mut);font-weight:500">' + it[0] + '</div>'
      : '<div class="en">' + it[0] + '</div><div class="hint">Tap to reveal translation</div>') +
    '</div>';
}

function renderLearn() {
  var c = CATS[S.cat], w = L[S.lang].w, n = c[2] - c[1];
  S.i = ((S.i % n) + n) % n;
  var idx = c[1] + S.i, it = w[idx];
  var chips = Object.keys(CATS).map(function (k) {
    return '<button class="chip' + (k === S.cat ? ' on' : '') + '" data-a="cat" data-v="' + k + '">' + CATS[k][0] + '</button>';
  }).join("");
  var k = isKnown(S.lang, idx);
  return '<div class="chips">' + chips + '</div>' +
    cardHTML(it, S.cat === "grammar" ? L[S.lang].t : "") +
    '<div class="row"><button class="btn" data-a="prev">← Prev</button>' +
    '<button class="btn" data-a="speak">🔊 Listen</button>' +
    '<button class="btn" data-a="next">Next →</button></div>' +
    '<div class="row"><button class="btn ' + (k ? 'k' : '') + '" data-a="known">' + (k ? '✓ Marked as known' : 'Mark as known') + '</button></div>' +
    '<p class="small" style="text-align:center">Card ' + (S.i + 1) + ' of ' + n + '</p>';
}

function dailyIdx() {
  var day = Math.floor(Date.now() / 86400000), start = (day * 5) % 12, a = [];
  for (var i = 0; i < 5; i++) a.push((start + i) % 12);
  return a;
}
function renderDaily() {
  var w = L[S.lang].w, done = P.days.indexOf(today()) > -1;
  var items = dailyIdx().map(function (i) {
    return '<div class="item"><div><b>' + w[i][1] + '</b><div class="small">' + w[i][2] + ' · ' + w[i][0] + '</div></div>' +
      '<button class="chip" data-a="say" data-v="' + i + '">🔊</button></div>';
  }).join("");
  return '<h2 style="margin:0 0 4px">Today’s lesson</h2><p class="small" style="margin:0 0 12px">5 new items in ' + L[S.lang].n + ' · 🔥 ' + streak() + ' day streak</p>' +
    items +
    '<div class="row"><button class="btn p" data-a="done"' + (done ? ' disabled' : '') + '>' + (done ? '✓ Completed today' : 'Mark today as done') + '</button></div>';
}

function startQuiz() {
  var w = L[S.lang].w;
  var order = shuffle(w.map(function (_, i) { return i; })).slice(0, 8);
  S.q = {n: 0, score: 0, ans: null, qs: order.map(function (i) {
    var wrong = shuffle(w.map(function (_, j) { return j; }).filter(function (j) { return j !== i; })).slice(0, 3);
    return {i: i, opts: shuffle([i].concat(wrong))};
  })};
}
function renderQuiz() {
  var q = S.q, w = L[S.lang].w;
  if (!q) return '<div class="q"><h2 style="margin-top:0">Practice quiz</h2><p>8 questions on ' + L[S.lang].n + '. Pick the correct meaning.</p></div><div class="row"><button class="btn p" data-a="startq">Start quiz</button></div>';
  if (q.n >= q.qs.length) {
    var best = Math.max(P.best[S.lang] || 0, q.score);
    P.best[S.lang] = best; save();
    return '<div class="q"><div class="small">Your score</div><div class="big">' + q.score + ' / ' + q.qs.length + '</div><p>' +
      (q.score >= 7 ? 'Excellent work! 🎉' : q.score >= 4 ? 'Good progress, keep practising.' : 'Review the flashcards and try again.') +
      '</p><div class="small">Best: ' + best + ' / ' + q.qs.length + '</div></div><div class="row"><button class="btn p" data-a="startq">Try again</button></div>';
  }
  var cur = q.qs[q.n], it = w[cur.i];
  var opts = cur.opts.map(function (j) {
    var cls = "";
    if (q.ans !== null) cls = j === cur.i ? " ok" : (j === q.ans ? " bad" : "");
    return '<button class="opt' + cls + '" data-a="ans" data-v="' + j + '"' + (q.ans !== null ? ' disabled' : '') + '>' + w[j][0] + '</button>';
  }).join("");
  return '<div class="bar"><i style="width:' + (q.n / q.qs.length * 100) + '%"></i></div>' +
    '<div class="q"><div class="small">Question ' + (q.n + 1) + ' of ' + q.qs.length + ' · What does this mean?</div><div class="nat">' + it[1] + '</div><div class="rom" style="color:var(--mut)">' + it[2] + '</div></div>' +
    opts +
    (q.ans !== null ? '<div class="row"><button class="btn p" data-a="nextq">' + (q.n + 1 >= q.qs.length ? 'See score' : 'Next question') + '</button></div>' : '');
}

function renderProgress() {
  var html = '<h2 style="margin:0 0 4px">Your progress</h2><p class="small" style="margin:0 0 12px">🔥 ' + streak() + ' day streak · saved on this device</p>';
  Object.keys(L).forEach(function (k) {
    var n = (P.known[k] || []).length;
    html += '<div class="item" style="display:block"><div style="display:flex;justify-content:space-between"><b style="font-size:16px">' + L[k].n + '</b><span class="small">' + n + '/12 known' + (P.best[k] ? ' · best quiz ' + P.best[k] + '/8' : '') + '</span></div><div class="bar" style="margin:8px 0 0"><i style="width:' + (n / 12 * 100) + '%"></i></div></div>';
  });
  return html + '<div class="row"><button class="btn" data-a="reset">Reset all progress</button></div>';
}

function render() {
  $("nav").innerHTML = TABS.map(function (t) {
    return '<button class="' + (S.tab === t[0] ? 'on' : '') + '" data-a="tab" data-v="' + t[0] + '">' + t[1] + '</button>';
  }).join("");
  var f = {learn: renderLearn, daily: renderDaily, quiz: renderQuiz, progress: renderProgress};
  $("main").innerHTML = f[S.tab]();
}

$("lang").innerHTML = Object.keys(L).map(function (k) { return '<option value="' + k + '">' + L[k].n + '</option>'; }).join("");
$("lang").value = S.lang;
$("lang").onchange = function () { S.lang = this.value; S.i = 0; S.flip = false; S.q = null; save(); render(); };

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-a]");
  if (!el) return;
  var a = el.getAttribute("data-a"), v = el.getAttribute("data-v"), w = L[S.lang].w, c = CATS[S.cat];
  if (a === "tab") { S.tab = v; S.flip = false; }
  else if (a === "cat") { S.cat = v; S.i = 0; S.flip = false; }
  else if (a === "flip") { S.flip = !S.flip; if (S.flip) speak(w[c[1] + S.i][1]); }
  else if (a === "next") { S.i++; S.flip = false; }
  else if (a === "prev") { S.i--; S.flip = false; }
  else if (a === "speak") { speak(w[c[1] + S.i][1]); return; }
  else if (a === "known") { toggleKnown(S.lang, c[1] + S.i); }
  else if (a === "say") { speak(w[+v][1]); return; }
  else if (a === "done") { if (P.days.indexOf(today()) < 0) P.days.push(today()); save(); }
  else if (a === "startq") { startQuiz(); }
  else if (a === "ans") { var cur = S.q.qs[S.q.n]; S.q.ans = +v; if (+v === cur.i) S.q.score++; }
  else if (a === "nextq") { S.q.n++; S.q.ans = null; }
  else if (a === "reset") { if (confirm("Reset all progress?")) { P = {known: {}, best: {}, days: []}; save(); } }
  render();
});
render();
</script>
</body>
